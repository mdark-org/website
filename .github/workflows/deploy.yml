name: Deploy Worker
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
env:
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ env.DEPLOY_ENV }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v7
      - name: install deps
        uses: pnpm/setup@v3
      - name: Generate .env
        uses: actions/github-script@v9
        env:
          INPUT_SECRETS: ${{ toJSON(secrets) }}
          INPUT_VARS: ${{ toJSON(vars) }}
          ENV_PATH: fuma/.env.${{ env.DEPLOY_ENV }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            
            const secrets = JSON.parse(process.env.INPUT_SECRETS);
            const vars = JSON.parse(process.env.INPUT_VARS);
            const values = { ...vars, ...secrets };
            const output = path.resolve(process.env.ENV_PATH);
            fs.mkdirSync(path.dirname(output), { recursive: true });
            fs.writeFileSync(
              output,
              Object.entries(values)
                .map(([key, value]) => `${key}=${JSON.stringify(value)}`)
                .join('\n') + '\n',
              { mode: 0o600 }
            );

      - name: Generate .secret
        uses: actions/github-script@v9
        env:
          INPUT_SECRETS: ${{ toJSON(secrets) }}
          ENV_PATH: fuma/.secret.${{ env.DEPLOY_ENV }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const secrets = JSON.parse(process.env.INPUT_SECRETS);
            const values = secrets;
            const output = path.resolve(process.env.ENV_PATH);
            fs.mkdirSync(path.dirname(output), { recursive: true });
            fs.writeFileSync(
              output,
              Object.entries(values)
                .map(([key, value]) => `${key}=${JSON.stringify(value)}`)
                .join('\n') + '\n',
              { mode: 0o600 }
            );
      - name: migrate db
        run: pnpm run migrate:${{ env.DEPLOY_ENV }}
        working-directory: fuma
      - name: deploy to cloudflare worker
        run: pnpm run deploy:${{ env.DEPLOY_ENV }}
        working-directory: fuma
