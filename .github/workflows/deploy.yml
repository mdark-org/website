name: Deploy Worker
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
env:
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v7
      - name: install deps
        uses: pnpm/setup@v3
      - name: Generate deployment .env and .secret
        shell: bash
        working-directory: fuma
        env:
          INPUT_VARS: ${{ toJSON(vars) }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SECRET_API_KEY: ${{ secrets.ALGOLIA_SECRET_API_KEY }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const environment = process.env.DEPLOY_ENV;
          const vars = JSON.parse(process.env.INPUT_VARS || '{}');
          const secrets = {
            ALGOLIA_APP_ID: process.env.ALGOLIA_APP_ID,
            ALGOLIA_SECRET_API_KEY: process.env.ALGOLIA_SECRET_API_KEY,
            SYNC_TOKEN: process.env.SYNC_TOKEN,
            GITHUB_TOKEN: process.env.GITHUB_TOKEN,
            BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET,
            GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET,
          };
          
          const missing = Object.entries(secrets)
            .filter(([, value]) => !value)
            .map(([key]) => key);
          if (missing.length) {
            throw new Error(`Missing secrets: ${missing.join(', ')}`);
          }
          
          const write = (filename, values) => {
            const output = filename;
            fs.writeFileSync(
              output,
              Object.entries(values)
                .map(([key, value]) => `${key}=${JSON.stringify(value)}`)
                .join('\n') + '\n',
              { mode: 0o600 }
            );
          };
          
          write(`.env.${environment}`, { ...vars, ...secrets });
          write(`.secret.${environment}`, secrets);
          NODE
      - name: migrate db
        run: pnpm run migrate:${{ env.DEPLOY_ENV }}
        working-directory: fuma
      - name: deploy to cloudflare worker
        run: pnpm run deploy:${{ env.DEPLOY_ENV }}
        working-directory: fuma
